# Cloudflare settings for the guestbook. See README.md in this folder.
name = "kanu-guestbook"
main = "worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "kanu-guestbook"
database_id = "PASTE-THE-ID-FROM-wrangler-d1-create"

[vars]
# the sites allowed to sign it: the live site, and your computer while testing
ALLOWED_ORIGINS = "https://kanusaru.github.io,http://localhost:3000"
