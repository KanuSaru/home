name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # Asks GitHub where the site lives: nothing on erickdonado.com (the custom
      # domain), "/home" if it were ever served from kanusaru.github.io/home again.
      # No edits needed when that changes.
      - id: pages
        uses: actions/configure-pages@v5
      # GitHub can report the address as http:// even with HTTPS enforced; the site is
      # only ever served over https, so every address it writes (sitemap, canonical
      # links, previews) uses https.
      - name: Site address
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: echo "SITE_URL=${BASE_URL/#http:/https:}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # tell Bing (and the other IndexNow engines) about the pages; never fails the deploy
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/indexnow.mjs
          sparse-checkout-cone-mode: false
      - name: IndexNow
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/indexnow.mjs
